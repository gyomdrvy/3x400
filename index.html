'use strict';
const KEY='eps_demi_fond_v1';const tabs=['Classes','Course 1','Pelotons','Course 2','Course 3','AFLP','Progression','Bilan'];let tab=0;

const girls=[158,153,148,143,138,134,130,126,122,118,115,112,110,108,106,104,102,100,98,96,94,92,90,88];
const rubric3=[['Degré 1','0 à 1','Investissement insuffisant, échauffement furtif, efforts inadaptés et/ou absences injustifiées.'],['Degré 2','1,5 à 2,5','Engagement irrégulier, efforts sur certaines courses, ne cherche pas à progresser.'],['Degré 3','3 à 4','Engagement régulier, efforts adaptés à la VMA, échauffement cohérent.'],['Degré 4','4,5 à 5','Progresse, analyse ses performances, cherche à progresser et aide ses camarades.']];
const rubric5=[['Degré 1','0','Échauffement inadapté, aucune récupération.'],['Degré 2','1','Échauffement irrégulier et récupération peu efficace.'],['Degré 3','2','Échauffement progressif et adapté, récupération après effort.'],['Degré 4','3','Échauffement progressif avec repérage d’allures, récupération active immédiate.']];
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.students))data={students:[],timers:{}};if(!data.timers)data.timers={};
// V4 : chaque classe possède une liste d'élèves et plusieurs évaluations indépendantes.
function makeEval(name,students){return {id:uid(),name,created:new Date().toISOString().slice(0,10),students:students.map(s=>({...newStudent(s.name,s.sex),id:s.id})),timers:{}}}
function ensureClass(c){
 if(!Array.isArray(c.students))c.students=[];
 if(!Array.isArray(c.evaluations)){
   c.evaluations=[{id:'eval-initial-'+c.id,name:'Évaluation initiale',created:'',students:c.students,timers:c.timers||{}}];
   c.activeEvaluationId=c.evaluations[0].id;
 }
 if(!c.evaluations.length)c.evaluations=[makeEval('Évaluation 1',c.students)];
 if(!c.evaluations.some(e=>e.id===c.activeEvaluationId))c.activeEvaluationId=c.evaluations[0].id;
 for(const e of c.evaluations){if(!Array.isArray(e.students))e.students=[];if(!e.timers)e.timers={};for(const s of c.students)if(!e.students.some(x=>x.id===s.id))e.students.push(newStudent(s.name,s.sex));}
}
if(!Array.isArray(data.classes))data.classes=[{id:'legacy',name:'Classe initiale',students:data.students,timers:data.timers}];
if(!data.classes.length)data.classes=[{id:'initial',name:'Ma classe',students:[],timers:{}}];
for(const c of data.classes)ensureClass(c);
if(!data.classes.some(c=>c.id===data.activeClassId))data.activeClassId=data.classes[0].id;
function activeClass(){return data.classes.find(c=>c.id===data.activeClassId)||data.classes[0]}
function activeEval(){let c=activeClass();return c.evaluations.find(e=>e.id===c.activeEvaluationId)||c.evaluations[0]}
function syncClass(){let e=activeEval();e.students=data.students;e.timers=data.timers}
function loadActive(){let e=activeEval();data.students=e.students;data.timers=e.timers}
function switchClass(id){syncClass();if(!data.classes.some(c=>c.id===id))return;data.activeClassId=id;loadActive();save();render()}
function switchEvaluation(id){syncClass();let c=activeClass();if(!c.evaluations.some(e=>e.id===id))return;c.activeEvaluationId=id;loadActive();save();render()}
function createClass(){let name=prompt('Nom de la nouvelle classe');if(!name||!name.trim())return;syncClass();let c={id:uid(),name:name.trim(),students:[],evaluations:[]};ensureClass(c);data.classes.push(c);data.activeClassId=c.id;loadActive();save();render()}
function renameClass(){let c=activeClass();let name=prompt('Nouveau nom de la classe',c.name);if(name&&name.trim()){c.name=name.trim();save();render()}}
function deleteClass(){if(data.classes.length===1){alert('Conservez au moins une classe.');return}let c=activeClass();if(!confirm('Supprimer '+c.name+' et toutes ses évaluations ? Sauvegardez avant.'))return;data.classes=data.classes.filter(x=>x.id!==c.id);data.activeClassId=data.classes[0].id;loadActive();save();render()}
function createEvaluation(){let c=activeClass();let name=prompt('Nom de la nouvelle évaluation (ex. Demi-fond novembre)');if(!name||!name.trim())return;syncClass();let e=makeEval(name.trim(),c.students);c.evaluations.push(e);c.activeEvaluationId=e.id;loadActive();save();render()}
function renameEvaluation(){let e=activeEval();let name=prompt('Nouveau nom de l’évaluation',e.name);if(name&&name.trim()){e.name=name.trim();save();render()}}
function duplicateEvaluation(){syncClass();let c=activeClass(),old=activeEval();let name=prompt('Nom de la copie',old.name+' (copie)');if(!name||!name.trim())return;let e=JSON.parse(JSON.stringify(old));e.id=uid();e.name=name.trim();e.created=new Date().toISOString().slice(0,10);e.timers={};c.evaluations.push(e);c.activeEvaluationId=e.id;loadActive();save();render()}
function deleteEvaluation(){let c=activeClass();if(c.evaluations.length===1){alert('Conservez au moins une évaluation.');return}if(!confirm('Supprimer cette évaluation et tous ses résultats ?'))return;let id=c.activeEvaluationId;c.evaluations=c.evaluations.filter(e=>e.id!==id);c.activeEvaluationId=c.evaluations[0].id;loadActive();save();render()}
function addRosterStudent(name,sex='G'){let c=activeClass(),s=newStudent(name,sex);c.students.push({id:s.id,name:s.name,sex:s.sex});for(const e of c.evaluations)e.students.push(newStudent(name,sex));loadActive()}
function updateRosterStudent(id,field,value){let c=activeClass(),s=c.students.find(x=>x.id===id);if(!s)return;s[field]=value;for(const e of c.evaluations){let st=e.students.find(x=>x.id===id);if(st)st[field]=value}save();render()}
function deleteRosterStudent(id){if(!confirm('Supprimer cet élève de la classe ET de toutes ses évaluations ?'))return;let c=activeClass();c.students=c.students.filter(s=>s.id!==id);for(const e of c.evaluations)e.students=e.students.filter(s=>s.id!==id);loadActive();save();render()}
loadActive();

function uid(){return Math.random().toString(36).slice(2,10)} const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){syncClass();try{localStorage.setItem(KEY,JSON.stringify(data));$('saveState').textContent='✓ Enregistré'}catch(e){alert('Stockage plein : exportez les données.')}}
function sec(v){if(v===null||v===undefined||v==='')return null;let s=String(v).trim().replace(',','.');let m=s.match(/^(\d+)\.(\d{1,2})$/);if(m){let n=+m[2];return n<60?+m[1]*60+n:null}if(/^\d+$/.test(s))return +s;return null}function fmt(s){if(s==null)return '—';let n=Math.round(s*100)/100;return Math.floor(n/60)+'.'+String(Math.floor(n%60)).padStart(2,'0')+(n%1?','+String(Math.round((n%1)*100)).padStart(2,'0'):'')}
function speed(distance,seconds){return seconds!=null&&Number.isFinite(seconds)&&seconds>0&&distance>0?Math.round(distance/seconds*3.6*100)/100:null}

function firstScore(s){let t=sec(s.c1);if(t===null)return null;let arr=s.sex==='F'?girls:boys;if(t>arr[0])return 0;let p=0;for(let i=0;i<arr.length;i++)if(t<=arr[i])p=(i+1)*.5;return p}

function csvLine(row){return row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')}function exportCSV(){let c=computed(),rows=[['Nom','Sexe','Temps C1','Vitesse C1 (km/h)','Peloton','Effectif','Plot C2','Classement C2','Points C2','Vitesse C2 (km/h)','Plot C3','Classement C3','Points C3','Vitesse C3 (km/h)','Points C1','Courses /12','AFLP CAP 3','AFLP CAP 5','Note /20']];for(let s of data.students){let r=c.rows[s.id];rows.push([s.name,s.sex,s.c1,r.speed1??"",r.p,r.n,r.plot2,s.c2rank,r.score2,r.speed2??"",r.plot3,s.c3rank,r.score3,r.speed3??"",r.score1,courseScore(r),s.aflp3,s.aflp5,score(s,r)])}download('notes_demi_fond_'+activeEval().name.replace(/[^a-z0-9_-]/gi,'_')+'_'+activeEval().name.replace(/[^a-z0-9_-]/gi,'_')+'.csv','\ufeff'+rows.map(csvLine).join('\r\n'),'text/csv;charset=utf-8')}

function parseCSV(text){let lines=text.replace(/^\ufeff/,'').trim().split(/\r?\n/);let delim=lines[0].includes(';')?';':',';function parse(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}let header=parse(lines[0]).map(x=>x.toLowerCase());let hasHeader=header.some(x=>/nom|prénom|prenom|sexe|genre/.test(x));let nameCol=header.findIndex(x=>/nom|élève|eleve/.test(x));let sexCol=header.findIndex(x=>/sexe|genre/.test(x));let added=0;for(let line of lines.slice(hasHeader?1:0)){let fields=parse(line);let name=(fields[nameCol>=0?nameCol:0]||'').trim();if(!name)continue;let sex=(fields[sexCol>=0?sexCol:1]||'G').toUpperCase().startsWith('F')?'F':'G';addRosterStudent(name,sex);added++}save();alert(added+' élèves importés');render()}
async function importFile(file){if(!file)return;try{if(/\.xlsx?$/i.test(file.name)){if(typeof XLSX==='undefined')throw Error('Le module Excel n’est pas chargé. Connectez-vous à Internet pour le premier import, ou exportez le fichier en CSV.');let bytes=await file.arrayBuffer();let workbook=XLSX.read(bytes,{type:'array',cellDates:false});let sheet=workbook.Sheets[workbook.SheetNames[0]];let rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});importRows(rows)}else parseCSV(await file.text())}catch(e){alert('Import impossible : '+e.message)}}
function importRows(rows){rows=rows.filter(row=>row.some(v=>String(v??'').trim()));if(!rows.length)throw Error('Fichier vide');let normalize=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();let head=rows[0].map(normalize);let hasHeader=head.some(x=>/nom|prenom|sexe|genre|eleve/.test(x));let nameCol=head.findIndex(x=>/^(nom complet|nom et prenom|eleve|eleves|nom prenom)$/.test(x));let lastCol=head.findIndex(x=>x==='nom'||x==='lastname');let firstCol=head.findIndex(x=>x==='prenom'||x==='firstname');let sexCol=head.findIndex(x=>/sexe|genre/.test(x));let added=0;for(const fields of rows.slice(hasHeader?1:0)){let name=nameCol>=0?String(fields[nameCol]??'').trim():lastCol>=0?([fields[lastCol],firstCol>=0?fields[firstCol]:''].map(v=>String(v??'').trim()).filter(Boolean).join(' ')):String(fields[0]??'').trim();if(!name)continue;let rawSex=sexCol>=0?fields[sexCol]:(hasHeader?'':fields[1]);let sex=/^(f|fille|feminin|female)/i.test(normalize(rawSex))?'F':'G';addRosterStudent(name,sex);added++}save();alert(added+' élèves importés depuis Excel');render()}
function timerKey(course,p){return course+'-'+p}function timer(course,p){let key=timerKey(course,p);return data.timers[key]??{elapsed:0,running:false}}function elapsed(t){return(t.elapsed||0)+(t.running?performance.now()-t.started:0)}function startTimer(course,p){let k=timerKey(course,p),t=timer(course,p);if(t.running)return;t.started=performance.now();t.running=true;data.timers[k]=t;render()}function stopTimer(course,p){let k=timerKey(course,p),t=timer(course,p);if(!t.running)return;t.elapsed=elapsed(t);t.running=false;delete t.started;save();render()}function resetTimer(course,p){if(!confirm('Remettre le chronomètre à zéro ? Les arrivées déjà enregistrées restent conservées.'))return;data.timers[timerKey(course,p)]={elapsed:0,running:false};save();render()}function finish(course,p,id){let t=timer(course,p);if(!t.running)return;let s=data.students.find(x=>x.id===id);if(!s)return;if(course===1&&s.c1!==''&&!confirm('Remplacer le temps C1 déjà enregistré ?'))return;if(course>1&&s['c'+course+'time']!=null&&!confirm('Remplacer cette arrivée déjà enregistrée ?'))return;let val=Math.round(elapsed(t)/1000);if(course===1)s.c1=fmt(val);else {s['c'+course+'time']=val;let field='c'+course+'rank';if(s[field]===''){let c=computed(),group=c.rows[id].p;let used=data.students.filter(x=>c.rows[x.id].p===group&&x[field]!=='').map(x=>Number(x[field]));let rank=1;while(used.includes(rank))rank++;s[field]=String(rank)}}save();render()}

 html+=`<section class="panel"><h3>Évolution de la moyenne — ${esc(metricNames[metric])}</h3><div class="chartwrap"><svg viewBox="0 0 790 280" role="img" aria-label="Courbe des moyennes par évaluation"><line x1="60" y1="225" x2="740" y2="225" stroke="#a7b8d0"/><line x1="60" y1="45" x2="60" y2="225" stroke="#a7b8d0"/>${[0,.25,.5,.75,1].map(f=>`<line x1="60" y1="${225-f*165}" x2="740" y2="${225-f*165}" stroke="#e0eaf6"/><text x="52" y="${229-f*165}" font-size="12" text-anchor="end" fill="#536a84">${(lo+(hi-lo)*f).toFixed(1)}</text>`).join('')}${polylines.map(seg=>`<polyline points="${seg}" fill="none" stroke="#0876d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}${points.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#00a897"/><text x="${p[0]}" y="${p[1]-13}" font-size="13" text-anchor="middle" fill="#12315a">${averages[i].avg.toFixed(2)}</text>`:'').join('')}${averages.map((a,i)=>`<text x="${65+(evals.length===1?0:i*650/(evals.length-1))}" y="253" font-size="12" text-anchor="middle" fill="#536a84">${i+1}</text>`).join('')}</svg></div><p class="muted">Les numéros sous la courbe correspondent aux évaluations du tableau ci-dessous.</p></section>`;
 html+=`<section class="panel scroll"><h3>Tableau comparatif des élèves</h3><table><thead><tr><th>Élève</th>${evals.map((e,i)=>`<th>${i+1}. ${esc(e.name)}</th>`).join('')}<th>Évolution</th></tr></thead><tbody>${ids.map(id=>{let student=cl.students.find(s=>s.id===id);let vals=sets.map(({rows,students})=>{let s=students.get(id);return s?metricValue(s,rows[id],metric):null});let present=vals.filter(v=>v!=null);let d=present.length>=2?present[present.length-1]-present[0]:null;return `<tr><td><strong>${esc(student.name)}</strong></td>${vals.map(v=>`<td>${fmtMetric(v,metric)}</td>`).join('')}<td class="${d==null?'':d>=0?'good':'warn'}"><b>${d==null?'—':(d>0?'+':'')+fmtMetric(d,metric)}</b></td></tr>`}).join('')}<tr><th>Moyenne (${ids.length} élèves sélectionnés)</th>${averages.map(a=>`<th>${fmtMetric(a.avg,metric)} <small>(${a.n})</small></th>`).join('')}<th>${delta==null?'—':(delta>0?'+':'')+fmtMetric(delta,metric)}</th></tr></tbody></table></section>`;
 return html;
}

if(tab===1){html=`<section class="panel"><h2>Course 1 — Départ collectif</h2>${timerUI(1,0)}<p class="muted">Toucher « Arrivée » à chaque passage. Les temps peuvent être corrigés au format 1.48 (1 min 48 s).</p></section><div class="grid">${data.students.map(s=>`<article class="runner ${s.c1!==''?'done':''}"><strong>${esc(s.name)}</strong><div class="row"><button class="primary" onclick="finish(1,0,'${s.id}')">🏁 Arrivée</button><label>Temps C1<input type="text" inputmode="decimal" value="${esc(s.c1)}" onchange="setStudent('${s.id}','c1',this.value)" placeholder="1.48"></label></div><span class="muted">${c.rows[s.id].score1??'—'} / 12 points · ${speedText(c.rows[s.id].speed1)}</span></article>`).join('')}</div>`}
if(tab===2){html=`<section class="panel"><h2>Pelotons après C1</h2><p>Un nouveau peloton commence dès que le temps dépasse de plus de 20 secondes celui de son élève de référence. Déplacement manuel possible ; les effectifs et points sont recalculés.</p></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>Temps C1</th><th>Peloton automatique</th><th>Peloton manuel (facultatif)</th><th>Peloton retenu</th><th>Effectif</th><th>Plot C2</th></tr></thead><tbody>${data.students.slice().sort((a,b)=>(sec(a.c1)??Infinity)-(sec(b.c1)??Infinity)||a.name.localeCompare(b.name,'fr')).map(s=>{let r=c.rows[s.id];return `<tr><td>${esc(s.name)}</td><td>${esc(s.c1)||'—'}</td><td>${r.auto??'—'}</td><td><input type="number" min="1" value="${esc(s.manualGroup)}" placeholder="Auto" onchange="setStudent('${s.id}','manualGroup',this.value)"></td><td>${r.p??'—'}</td><td>${r.n||'—'}</td><td>${r.plot2===null?'—':r.plot2>20?'<span class="warn">HORS PLOTS</span>':r.plot2}</td></tr>`}).join('')}</tbody></table></section>`}
if(tab===3||tab===4){let course=tab===3?2:3;let entries=Object.entries(c.groups).sort((a,b)=>+a[0]-+b[0]);html=`<section class="panel"><h2>Course ${course} — Chronos par peloton</h2><p class="muted">Vitesse = (400 m − 3 m × numéro du plot) ÷ temps chronométré × 3,6. Le chrono enregistre les temps d’arrivée. Le classement est modifiable indépendamment. Sans classement, l’élève obtient 0 point. L’effectif reste fixé par les élèves affectés au peloton depuis C1.</p></section>`+entries.map(([p,students])=>`<section class="panel group"><h2>Peloton ${p} — ${students.length} élèves</h2>${timerUI(course,p)}<div class="grid">${students.slice().sort((a,b)=>course===2?sec(a.c1)-sec(b.c1):(Number(a.c2rank)||999)-(Number(b.c2rank)||999)).map(s=>{let r=c.rows[s.id],plot=course===2?r.plot2:r.plot3,rankField='c'+course+'rank',timeField='c'+course+'time';return `<article class="runner ${s[timeField]!=null?'done':''}"><strong>${esc(s.name)}</strong><div class="row"><span class="badge">Plot ${plot==null?'—':plot>20?'HORS PLOTS':plot}</span><button class="primary" onclick="finish(${course},${p},'${s.id}')">🏁 Arrivée</button></div><div class="row"><label>Temps observé<input type="text" value="${s[timeField]==null?'':fmt(s[timeField])}" onchange="let x=sec(this.value);setStudent('${s.id}','${timeField}',x)"></label><label>Classement<input type="number" min="1" max="${students.length}" value="${esc(s[rankField])}" onchange="setStudent('${s.id}','${rankField}',this.value)"></label></div><b>${course===2?r.score2:r.score3} / ${course===2?5:4} points</b><span class="muted">Distance : ${plot==null||plot>20?'—':400-3*plot} m · Vitesse : ${speedText(course===2?r.speed2:r.speed3)}</span></article>`}).join('')}</div></section>`).join('');if(!entries.length)html+='<section class="panel">Saisis d’abord les temps de C1 pour créer les pelotons.</section>'}
if(tab===5){html=`<section class="panel"><h2>Grilles d’évaluation AFLP</h2><div class="grid"><div><h3>AFLP CAP 3 — Engagement et persévérance (/5)</h3>${rubric3.map((x,i)=>`<p class="rubric ${['grade-red','grade-orange','grade-yellow','grade-green'][i]}" style="padding:9px;border-radius:8px"><b>${x[0]} (${x[1]} pt)</b> : ${x[2]}</p>`).join('')}</div><div><h3>AFLP CAP 5 — Rôles, échauffement et récupération (/3)</h3>${rubric5.map((x,i)=>`<p class="rubric ${['grade-red','grade-orange','grade-yellow','grade-green'][i]}" style="padding:9px;border-radius:8px"><b>${x[0]} (${x[1]} pt)</b> : ${x[2]}</p>`).join('')}</div></div></section><section class="panel"><p class="muted">Touchez une note : rouge = degré 1, orange = degré 2, jaune = degré 3, vert = degré 4. ✕ efface la note.</p>${data.students.map(s=>`<article class="runner" style="margin-bottom:12px"><strong>${esc(s.name)}</strong><div><b>AFLP CAP 3 /5</b>${gradeButtons(s,'aflp3',5)}</div><div><b>AFLP CAP 5 /3</b>${gradeButtons(s,'aflp5',3)}</div></article>`).join('')}</section>`}
if(tab===6){html=progressionView()}
if(tab===7){html=`<section class="panel"><h2>Bilan — ${esc(activeEval().name)}</h2><p>(C1 + C2 + C3) ÷ 21 × 12 + AFLP CAP 3 + AFLP CAP 5</p><div class="row"><button class="primary" onclick="exportCSV()">⬇ Export CSV complet</button><button class="primary" onclick="exportIDoceo()">⬇ CSV pour iDoceo</button><span class="muted">Dans iDoceo, importez ce CSV dans le carnet de notes de la classe correspondante. Vérifiez l’association Nom/Prénom et les colonnes.</span><button onclick="download('sauvegarde_demi_fond.json',JSON.stringify(data,null,2),'application/json')">⬇ Sauvegarder tout</button></div></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>Peloton</th><th>C1 /12</th><th>Vitesse C1</th><th>C2 /5</th><th>Vitesse C2</th><th>C3 /4</th><th>Vitesse C3</th><th>Courses /12</th><th>AFLP 3 /5</th><th>AFLP 5 /3</th><th>Note /20</th></tr></thead><tbody>${data.students.map(s=>{let r=c.rows[s.id];return `<tr><td>${esc(s.name)}</td><td>${r.p??'—'}</td><td>${r.score1??'—'}</td><td>${speedText(r.speed1)}</td><td>${r.score2}</td><td>${speedText(r.speed2)}</td><td>${r.score3}</td><td>${speedText(r.speed3)}</td><td class="scorecourse">${courseScore(r)??'—'}</td><td>${s.aflp3===''?'—':s.aflp3}</td><td>${s.aflp5===''?'—':s.aflp5}</td><td class="score">${score(s,r)??'—'}</td></tr>`}).join('')}</tbody></table></section>`}
if(tab!==0)html=`<section class="panel row"><strong>${esc(activeClass().name)}</strong><label>Évaluation <select onchange="switchEvaluation(this.value)">${activeClass().evaluations.map(e=>`<option value="${esc(e.id)}" ${e.id===activeClass().activeEvaluationId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><button onclick="tab=0;render()">Gérer les évaluations</button></section>`+html;$('app').innerHTML=html;let csv=$('csv');if(csv)csv.onchange=async e=>{let f=e.target.files[0];if(f)await importFile(f)};let restore=$('restore');if(restore)restore.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.students)&&!Array.isArray(x.classes))throw Error();if(confirm('Remplacer toutes les classes actuelles par cette sauvegarde ?')){if(!Array.isArray(x.classes)){x.classes=[{id:'legacy',name:'Classe restaurée',students:x.students,timers:{}}];x.activeClassId='legacy'}if(!x.classes.length)throw Error();data=x;for(const cl of data.classes)ensureClass(cl);if(!data.classes.some(cl=>cl.id===data.activeClassId))data.activeClassId=data.classes[0].id;for(const cl of data.classes)for(const e of cl.evaluations)e.timers={};loadActive();save();render()}}catch{alert('Fichier JSON invalide')}};clocks()}
// Use a monotonic clock while app is active; do not claim accurate timing when iPad suspends the page.
window.addEventListener('pagehide',()=>{for(let t of Object.values(data.timers))if(t.running){t.elapsed=elapsed(t);t.running=false;delete t.started}save()});
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
