<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b4e"><link rel="manifest" href="manifest.json"><title>EPS Demi-fond</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16283c;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}header{background:#102b4e;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:20px;margin:0}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:white;position:sticky;top:0;z-index:2}button,.btn,select,input{font:inherit}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#e4eaf2;color:#102b4e;cursor:pointer;touch-action:manipulation}button.primary{background:#1267d5;color:white}button.danger{background:#ba283c;color:white}button:disabled{opacity:.45}nav button.active{background:#1267d5;color:white}main{padding:15px;max-width:1250px;margin:auto}.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #16283c12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.runner{border:1px solid #dae2ec;border-radius:12px;padding:12px;display:grid;gap:8px}.runner.done{background:#e7f7ed}.runner strong{font-size:17px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.clock{font-size:clamp(38px,8vw,76px);font-variant-numeric:tabular-nums;font-weight:750}.muted{color:#596c80;font-size:13px}input,select{padding:10px;border:1px solid #bac8d7;border-radius:9px;max-width:100%}input[type=number]{width:85px}input[type=text]{width:150px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#eaf1fa;position:sticky;top:0}.scroll{overflow:auto} .score{font-weight:700}.warn{color:#a13213}.good{color:#167044}.small{font-size:13px}.sectionTitle{margin:4px 0 10px}.group{border-left:5px solid #1267d5;padding-left:12px}.badge{background:#e4eaf2;padding:4px 9px;border-radius:8px}.rubric{font-size:13px;color:#42546a;line-height:1.4}textarea{width:100%;min-height:90px;border:1px solid #bac8d7;border-radius:8px;padding:10px}label{display:grid;gap:5px;font-size:14px}footer{padding:20px;color:#596c80;text-align:center;font-size:12px}@media(max-width:600px){.panel{padding:11px}.runner button{min-height:48px}}
</style></head><body><header><h1>🏃 EPS • Demi-fond 2nde PRO</h1><span id="saveState" class="small">Sauvegarde locale</span></header><nav id="nav"></nav><main id="app"></main><footer>Les données restent sur cet appareil. Exporter régulièrement une sauvegarde JSON.</footer><script>
'use strict';
const KEY='eps_demi_fond_v1';const tabs=['Élèves','Course 1','Pelotons','Course 2','Course 3','AFLP','Bilan'];let tab=0;
const boys=[132,127,122,118,114,110,106,102,99,96,93,90,88,86,84,82,80,78,76,74,72,70,69,68];
const girls=[158,153,148,143,138,134,130,126,122,118,115,112,110,108,106,104,102,100,98,96,94,92,90,88];
const rubric3=[['Degré 1','0 à 1','Investissement insuffisant, échauffement furtif, efforts inadaptés et/ou absences injustifiées.'],['Degré 2','1,5 à 2,5','Engagement irrégulier, efforts sur certaines courses, ne cherche pas à progresser.'],['Degré 3','3 à 4','Engagement régulier, efforts adaptés à la VMA, échauffement cohérent.'],['Degré 4','4,5 à 5','Progresse, analyse ses performances, cherche à progresser et aide ses camarades.']];
const rubric5=[['Degré 1','0','Échauffement inadapté, aucune récupération.'],['Degré 2','1','Échauffement irrégulier et récupération peu efficace.'],['Degré 3','2','Échauffement progressif et adapté, récupération après effort.'],['Degré 4','3','Échauffement progressif avec repérage d’allures, récupération active immédiate.']];
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.students))data={students:[],timers:{}};if(!data.timers)data.timers={};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveState').textContent='✓ Enregistré'}catch(e){alert('Stockage plein : exportez les données.')}}
function sec(v){if(v===null||v===undefined||v==='')return null;let s=String(v).trim().replace(',','.');let m=s.match(/^(\d+)\.(\d{1,2})$/);if(m){let n=+m[2];return n<60?+m[1]*60+n:null}if(/^\d+$/.test(s))return +s;return null}function fmt(s){if(s==null)return '—';let n=Math.round(s*100)/100;return Math.floor(n/60)+'.'+String(Math.floor(n%60)).padStart(2,'0')+(n%1?','+String(Math.round((n%1)*100)).padStart(2,'0'):'')}
function firstScore(s){let t=sec(s.c1);if(t===null)return null;let arr=s.sex==='F'?girls:boys;if(t>arr[0])return 0;let p=0;for(let i=0;i<arr.length;i++)if(t<=arr[i])p=(i+1)*.5;return p}
function computed(){let ordered=data.students.filter(s=>sec(s.c1)!==null).slice().sort((a,b)=>sec(a.c1)-sec(b.c1));let ref=null,g=0,auto={};for(const s of ordered){let t=sec(s.c1);if(ref===null||t-ref>20){g++;ref=t}auto[s.id]=g}let groups={};for(const s of data.students){let p=s.manualGroup!==''&&s.manualGroup!=null?Number(s.manualGroup):(auto[s.id]||null);if(p&&Number.isInteger(p)&&p>0)(groups[p]??=[]).push(s)}let rows={};for(const s of data.students){let p=s.manualGroup!==''&&s.manualGroup!=null?Number(s.manualGroup):(auto[s.id]||null);let peers=groups[p]||[],n=peers.length,base=Math.min(...peers.map(x=>sec(x.c1)??Infinity));let plot2=sec(s.c1)!==null&&isFinite(base)?Math.round(sec(s.c1)-base):null;let rank2=Number(s.c2rank),rank3=Number(s.c3rank);let valid2=s.c2rank!==''&&s.c2rank!=null&&Number.isInteger(rank2)&&rank2>=1&&rank2<=n;let valid3=s.c3rank!==''&&s.c3rank!=null&&Number.isInteger(rank3)&&rank3>=1&&rank3<=n;rows[s.id]={p,n,auto:auto[s.id]||null,plot2,plot3:valid2?rank2-1:null,score1:firstScore(s),score2:valid2?Math.round((5*(n-rank2+1)/n)*10)/10:0,score3:valid3?Math.round((4*(n-rank3+1)/n)*10)/10:0,valid2,valid3}}return{rows,groups}}
function score(s,r){if(r.score1===null)return null;let a=Number(s.aflp3)||0,b=Number(s.aflp5)||0;return Math.round((((r.score1+r.score2+r.score3)/21)*12+a+b)*100)/100}
function setStudent(id,field,value){let s=data.students.find(x=>x.id===id);if(!s)return;s[field]=value;save();render()}function newStudent(name='',sex='G'){return{id:uid(),name,sex,c1:'',manualGroup:'',c2rank:'',c3rank:'',aflp3:'',aflp5:'',c2time:null,c3time:null}}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csvLine(row){return row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')}function exportCSV(){let c=computed(),rows=[['Nom','Sexe','Temps C1','Peloton','Effectif','Plot C2','Classement C2','Points C2','Plot C3','Classement C3','Points C3','Points C1','AFLP CAP 3','AFLP CAP 5','Note /20']];for(let s of data.students){let r=c.rows[s.id];rows.push([s.name,s.sex,s.c1,r.p,r.n,r.plot2,s.c2rank,r.score2,r.plot3,s.c3rank,r.score3,r.score1,s.aflp3,s.aflp5,score(s,r)])}download('notes_demi_fond.csv','\ufeff'+rows.map(csvLine).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(text){let lines=text.replace(/^\ufeff/,'').trim().split(/\r?\n/);let delim=lines[0].includes(';')?';':',';function parse(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}let header=parse(lines[0]).map(x=>x.toLowerCase());let hasHeader=header.some(x=>/nom|prénom|prenom|sexe|genre/.test(x));let nameCol=header.findIndex(x=>/nom|élève|eleve/.test(x));let sexCol=header.findIndex(x=>/sexe|genre/.test(x));let added=0;for(let line of lines.slice(hasHeader?1:0)){let fields=parse(line);let name=(fields[nameCol>=0?nameCol:0]||'').trim();if(!name)continue;let sex=(fields[sexCol>=0?sexCol:1]||'G').toUpperCase().startsWith('F')?'F':'G';data.students.push(newStudent(name,sex));added++}save();alert(added+' élèves importés');render()}
function timerKey(course,p){return course+'-'+p}function timer(course,p){let key=timerKey(course,p);return data.timers[key]??{elapsed:0,running:false}}function elapsed(t){return(t.elapsed||0)+(t.running?performance.now()-t.started:0)}function startTimer(course,p){let k=timerKey(course,p),t=timer(course,p);if(t.running)return;t.started=performance.now();t.running=true;data.timers[k]=t;render()}function stopTimer(course,p){let k=timerKey(course,p),t=timer(course,p);if(!t.running)return;t.elapsed=elapsed(t);t.running=false;delete t.started;save();render()}function resetTimer(course,p){if(!confirm('Remettre le chronomètre à zéro ? Les arrivées déjà enregistrées restent conservées.'))return;data.timers[timerKey(course,p)]={elapsed:0,running:false};save();render()}function finish(course,p,id){let t=timer(course,p);if(!t.running)return;let s=data.students.find(x=>x.id===id);if(!s)return;let val=Math.round(elapsed(t)/1000);if(course===1)s.c1=fmt(val);else {s['c'+course+'time']=val;let field='c'+course+'rank';if(s[field]===''){let c=computed(),group=c.rows[id].p;let used=data.students.filter(x=>c.rows[x.id].p===group&&x[field]!=='').map(x=>Number(x[field]));let rank=1;while(used.includes(rank))rank++;s[field]=String(rank)}}save();render()}
function clocks(){document.querySelectorAll('[data-clock]').forEach(el=>{let [course,p]=el.dataset.clock.split(':');el.textContent=fmt(elapsed(timer(course,p))/1000)})}setInterval(clocks,100);
function timerUI(course,p){let t=timer(course,p);return `<div class="row"><div class="clock" data-clock="${course}:${p}">${fmt(elapsed(t)/1000)}</div><button class="primary" ${t.running?'disabled':''} onclick="startTimer(${course},${p})">▶ Départ</button><button ${!t.running?'disabled':''} onclick="stopTimer(${course},${p})">⏸ Pause</button><button onclick="resetTimer(${course},${p})">↺ Réinitialiser</button></div>`}
function render(){let c=computed();$('nav').innerHTML=tabs.map((x,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${x}</button>`).join('');let html='';
if(tab===0){html=`<section class="panel"><h2>Importer les élèves</h2><p class="muted">CSV avec colonnes Nom;Sexe (F ou G), ou un nom par ligne. Les données restent sur l’iPad.</p><div class="row"><input type="file" id="csv" accept=".csv,.txt,text/csv"><button onclick="let n=prompt('Nom et prénom de l’élève');if(n){data.students.push(newStudent(n));save();render()}">+ Ajouter un élève</button><button onclick="download('sauvegarde_demi_fond.json',JSON.stringify(data,null,2),'application/json')">⬇ Sauvegarder JSON</button><label class="btn">Restaurer JSON <input style="width:160px" type="file" id="restore" accept=".json"></label></div></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>Sexe</th><th>Action</th></tr></thead><tbody>${data.students.map(s=>`<tr><td><input type="text" value="${esc(s.name)}" onchange="setStudent('${s.id}','name',this.value)"></td><td><select onchange="setStudent('${s.id}','sex',this.value)"><option ${s.sex==='G'?'selected':''}>G</option><option ${s.sex==='F'?'selected':''}>F</option></select></td><td><button class="danger" onclick="if(confirm('Supprimer cet élève ?')){data.students=data.students.filter(x=>x.id!=='${s.id}');save();render()}">Supprimer</button></td></tr>`).join('')}</tbody></table></section>`}
if(tab===1){html=`<section class="panel"><h2>Course 1 — Départ collectif</h2>${timerUI(1,0)}<p class="muted">Toucher « Arrivée » à chaque passage. Les temps peuvent être corrigés au format 1.48 (1 min 48 s).</p></section><div class="grid">${data.students.map(s=>`<article class="runner ${s.c1!==''?'done':''}"><strong>${esc(s.name)}</strong><div class="row"><button class="primary" onclick="finish(1,0,'${s.id}')">🏁 Arrivée</button><label>Temps C1<input type="text" inputmode="decimal" value="${esc(s.c1)}" onchange="setStudent('${s.id}','c1',this.value)" placeholder="1.48"></label></div><span class="muted">${c.rows[s.id].score1??'—'} / 12 points</span></article>`).join('')}</div>`}
if(tab===2){html=`<section class="panel"><h2>Pelotons après C1</h2><p>Un nouveau peloton commence dès que le temps dépasse de plus de 20 secondes celui de son élève de référence. Déplacement manuel possible ; les effectifs et points sont recalculés.</p></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>Temps C1</th><th>Peloton automatique</th><th>Peloton manuel (facultatif)</th><th>Peloton retenu</th><th>Effectif</th><th>Plot C2</th></tr></thead><tbody>${data.students.map(s=>{let r=c.rows[s.id];return `<tr><td>${esc(s.name)}</td><td>${esc(s.c1)||'—'}</td><td>${r.auto??'—'}</td><td><input type="number" min="1" value="${esc(s.manualGroup)}" placeholder="Auto" onchange="setStudent('${s.id}','manualGroup',this.value)"></td><td>${r.p??'—'}</td><td>${r.n||'—'}</td><td>${r.plot2===null?'—':r.plot2>20?'<span class="warn">HORS PLOTS</span>':r.plot2}</td></tr>`}).join('')}</tbody></table></section>`}
if(tab===3||tab===4){let course=tab===3?2:3;let entries=Object.entries(c.groups).sort((a,b)=>+a[0]-+b[0]);html=`<section class="panel"><h2>Course ${course} — Chronos par peloton</h2><p class="muted">Le chrono enregistre les temps d’arrivée. Le classement est modifiable indépendamment. Sans classement, l’élève obtient 0 point. L’effectif reste fixé par les élèves affectés au peloton depuis C1.</p></section>`+entries.map(([p,students])=>`<section class="panel group"><h2>Peloton ${p} — ${students.length} élèves</h2>${timerUI(course,p)}<div class="grid">${students.slice().sort((a,b)=>course===2?sec(a.c1)-sec(b.c1):(Number(a.c2rank)||999)-(Number(b.c2rank)||999)).map(s=>{let r=c.rows[s.id],plot=course===2?r.plot2:r.plot3,rankField='c'+course+'rank',timeField='c'+course+'time';return `<article class="runner ${s[timeField]!=null?'done':''}"><strong>${esc(s.name)}</strong><div class="row"><span class="badge">Plot ${plot==null?'—':plot>20?'HORS PLOTS':plot}</span><button class="primary" onclick="finish(${course},${p},'${s.id}')">🏁 Arrivée</button></div><div class="row"><label>Temps observé<input type="text" value="${s[timeField]==null?'':fmt(s[timeField])}" onchange="let x=sec(this.value);setStudent('${s.id}','${timeField}',x)"></label><label>Classement<input type="number" min="1" max="${students.length}" value="${esc(s[rankField])}" onchange="setStudent('${s.id}','${rankField}',this.value)"></label></div><b>${course===2?r.score2:r.score3} / ${course===2?5:4} points</b></article>`}).join('')}</div></section>`).join('');if(!entries.length)html+='<section class="panel">Saisis d’abord les temps de C1 pour créer les pelotons.</section>'}
if(tab===5){html=`<section class="panel"><h2>Grilles d’évaluation AFLP</h2><div class="grid"><div><h3>AFLP CAP 3 — Engagement et persévérance (/5)</h3>${rubric3.map(x=>`<p class="rubric"><b>${x[0]} (${x[1]} pt)</b> : ${x[2]}</p>`).join('')}</div><div><h3>AFLP CAP 5 — Rôles, échauffement et récupération (/3)</h3>${rubric5.map(x=>`<p class="rubric"><b>${x[0]} (${x[1]} pt)</b> : ${x[2]}</p>`).join('')}</div></div></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>AFLP CAP 3 /5</th><th>AFLP CAP 5 /3</th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.name)}</td><td><select onchange="setStudent('${s.id}','aflp3',this.value)"><option value="">Non évalué</option>${[0,.5,1,1.5,2,2.5,3,3.5,4,4.5,5].map(x=>`<option value="${x}" ${String(s.aflp3)===String(x)?'selected':''}>${x}</option>`).join('')}</select></td><td><select onchange="setStudent('${s.id}','aflp5',this.value)"><option value="">Non évalué</option>${[0,1,2,3].map(x=>`<option value="${x}" ${String(s.aflp5)===String(x)?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></section>`}
if(tab===6){html=`<section class="panel"><h2>Bilan des évaluations</h2><p>(C1 + C2 + C3) ÷ 21 × 12 + AFLP CAP 3 + AFLP CAP 5</p><div class="row"><button class="primary" onclick="exportCSV()">⬇ Exporter les notes CSV</button><button onclick="download('sauvegarde_demi_fond.json',JSON.stringify(data,null,2),'application/json')">⬇ Sauvegarder tout</button></div></section><section class="panel scroll"><table><thead><tr><th>Élève</th><th>Peloton</th><th>C1 /12</th><th>C2 /5</th><th>C3 /4</th><th>AFLP 3 /5</th><th>AFLP 5 /3</th><th>Note /20</th></tr></thead><tbody>${data.students.map(s=>{let r=c.rows[s.id];return `<tr><td>${esc(s.name)}</td><td>${r.p??'—'}</td><td>${r.score1??'—'}</td><td>${r.score2}</td><td>${r.score3}</td><td>${s.aflp3===''?'—':s.aflp3}</td><td>${s.aflp5===''?'—':s.aflp5}</td><td class="score">${score(s,r)??'—'}</td></tr>`}).join('')}</tbody></table></section>`}
$('app').innerHTML=html;let csv=$('csv');if(csv)csv.onchange=async e=>{let f=e.target.files[0];if(f)parseCSV(await f.text())};let restore=$('restore');if(restore)restore.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.students))throw Error();if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){data=x;data.timers={};save();render()}}catch{alert('Fichier JSON invalide')}};clocks()}
// Use a monotonic clock while app is active; do not claim accurate timing when iPad suspends the page.
window.addEventListener('pagehide',()=>{for(let t of Object.values(data.timers))if(t.running){t.elapsed=elapsed(t);t.running=false;delete t.started}save()});
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
